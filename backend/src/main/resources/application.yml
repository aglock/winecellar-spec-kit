spring:
  application:
    name: winecellar-importer
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/winecellar}

server:
  port: ${SERVER_PORT:8080}

owner:
  id: ${OWNER_ID:owner-default}
  display-name: ${OWNER_DISPLAY_NAME:Cellar Owner}

api:
  cors:
    allowed-origins: ${API_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

  

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  endpoints:
    web:
      exposure:
        include: "*"
